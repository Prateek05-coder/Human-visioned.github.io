// ─── look-at-camera ─────────────────────────────
AFRAME.registerComponent('look-at-camera', {
  tick: function () {
    const cam = this.el.sceneEl.camera;
    if (!cam) return;
    const camPos = new THREE.Vector3();
    cam.getWorldPosition(camPos);
    this.el.object3D.lookAt(camPos);
  }
});

// ─── pulse-animation ─────────────────────────────
AFRAME.registerComponent('pulse-animation', {
  schema: {
    speed: { type: 'number', default: 1.0 },
    amplitude: { type: 'number', default: 0.04 }
  },
  init: function () {
    this._baseScale = null;
    this._time = Math.random() * Math.PI * 2;
  },
  tick: function (time, delta) {
    if (!this._baseScale) {
      const s = this.el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
      this._baseScale = { x: s.x, y: s.y, z: s.z };
    }
    this._time += (delta / 1000) * this.data.speed;
    const f = 1 + Math.sin(this._time) * this.data.amplitude;
    this.el.object3D.scale.set(
      this._baseScale.x * f,
      this._baseScale.y * f,
      this._baseScale.z * f
    );
  }
});

// ─── grid-floor ─────────────────────────────
AFRAME.registerComponent('grid-floor', {
  init: function () {
    const g = new THREE.GridHelper(50, 100, 0x1a3a5c, 0x0d1f33);
    this.el.setObject3D('grid', g);
  }
});

// ─── floating-particles ─────────────────────────────
AFRAME.registerComponent('floating-particles', {
  init: function () {
    const count = 300;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i += 3) {
      pos[i] = (Math.random() - 0.5) * 24;
      pos[i + 1] = Math.random() * 10;
      pos[i + 2] = (Math.random() - 0.5) * 24;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({ color: 0x1a6a8a, size: 0.025, transparent: true, opacity: 0.4 });
    this._pts = new THREE.Points(geo, mat);
    this.el.setObject3D('particles', this._pts);
  },
  tick: function (t) { if (this._pts) this._pts.rotation.y = t * 0.00002; }
});

// ─── nerve-glow (pulsing emissive for nerve paths) ─────────────────────────────
AFRAME.registerComponent('nerve-glow', {
  schema: { active: { type: 'boolean', default: false } },
  init: function () { this._time = Math.random() * 6.28; },
  tick: function (time, delta) {
    this._time += (delta / 1000) * 3;
    const base = this.data.active ? 0.6 : 0.15;
    const pulse = this.data.active ? Math.sin(this._time) * 0.3 : 0;
    const opacity = base + pulse;
    const children = this.el.querySelectorAll('[material]');
    children.forEach(c => {
      c.setAttribute('material', 'opacity', Math.max(0.05, opacity));
      if (this.data.active) {
        c.setAttribute('material', 'emissive', '#ffeb3b');
        c.setAttribute('material', 'emissiveIntensity', 0.5 + pulse * 0.3);
      } else {
        c.setAttribute('material', 'emissive', '#000000');
        c.setAttribute('material', 'emissiveIntensity', 0);
      }
    });
  }
});

// ─── organ-interaction (MAIN — hover labels, click reports, nerve highlights) ──
AFRAME.registerComponent('organ-interaction', {
  schema: { organKey: { type: 'string', default: '' } },
  init: function () {
    const el = this.el;
    const key = this.data.organKey;
    const organData = PATIENT_DATA.organs[key];
    if (!organData) return;

    this._labelEl = null;
    this._origScale = null;

    el.addEventListener('mouseenter', () => {
      this._showLabel(organData);
      this._origScale = this._origScale || { ...el.getAttribute('scale') || { x: 1, y: 1, z: 1 } };
      el.setAttribute('scale', {
        x: this._origScale.x * 1.1,
        y: this._origScale.y * 1.1,
        z: this._origScale.z * 1.1
      });
      this._setEmissive(el, 0.3);
      this._highlightNerves(key, true);
    });

    el.addEventListener('mouseleave', () => {
      this._hideLabel();
      if (this._origScale) el.setAttribute('scale', this._origScale);
      this._setEmissive(el, 0);
      this._highlightNerves(key, false);
    });

    el.addEventListener('click', () => {
      this._showReport(organData, 'diagnostic');
    });
  },

  _setEmissive: function (entity, intensity) {
    const setOnEl = (e) => {
      const mat = e.getAttribute('material');
      if (mat) {
        const c = mat.color || '#ffffff';
        e.setAttribute('material', 'emissive', intensity > 0 ? c : '#000000');
        e.setAttribute('material', 'emissiveIntensity', intensity);
      }
    };
    setOnEl(entity);
    entity.querySelectorAll('[material]').forEach(setOnEl);
  },

  _highlightNerves: function (organKey, active) {
    const related = NERVE_ORGAN_MAP[organKey] || [];
    ALL_NERVE_IDS.forEach(id => {
      const nerveEl = document.querySelector('#' + id);
      if (!nerveEl) return;
      if (active) {
        nerveEl.setAttribute('nerve-glow', 'active', related.includes(id));
        if (!related.includes(id)) {
          nerveEl.querySelectorAll('[material]').forEach(c => c.setAttribute('material', 'opacity', 0.04));
        }
      } else {
        nerveEl.setAttribute('nerve-glow', 'active', false);
        nerveEl.querySelectorAll('[material]').forEach(c => c.setAttribute('material', 'opacity', 0.15));
      }
    });
  },

  _showLabel: function (organData) {
    this._hideLabel();
    const label = document.createElement('a-entity');
    label.setAttribute('id', 'hover-label-active');
    const wp = new THREE.Vector3();
    this.el.object3D.getWorldPosition(wp);
    label.setAttribute('position', { x: wp.x, y: wp.y + 0.38, z: wp.z });
    label.setAttribute('look-at-camera', '');

    const bg = document.createElement('a-plane');
    bg.setAttribute('width', '1.6'); bg.setAttribute('height', '0.24');
    bg.setAttribute('color', '#0d1b2a'); bg.setAttribute('opacity', '0.94');
    bg.setAttribute('material', 'shader: flat'); bg.setAttribute('position', '0 0 0');
    label.appendChild(bg);

    const border = document.createElement('a-plane');
    border.setAttribute('width', '1.62'); border.setAttribute('height', '0.26');
    border.setAttribute('color', '#00e5ff'); border.setAttribute('opacity', '0.55');
    border.setAttribute('material', 'shader: flat'); border.setAttribute('position', '0 0 -0.001');
    label.appendChild(border);

    const txt = document.createElement('a-text');
    txt.setAttribute('value', organData.anatomicalPart);
    txt.setAttribute('align', 'center'); txt.setAttribute('color', '#e0f7fa');
    txt.setAttribute('width', '2.0'); txt.setAttribute('position', '0 0 0.002');
    txt.setAttribute('font', 'mozillavr');
    label.appendChild(txt);

    this._labelEl = label;
    this.el.sceneEl.appendChild(label);
  },

  _hideLabel: function () {
    if (this._labelEl && this._labelEl.parentNode) this._labelEl.parentNode.removeChild(this._labelEl);
    this._labelEl = null;
  },

  _showReport: function (organData, tab) {
    const panel = document.querySelector('#report-panel');
    if (!panel) return;

    // Position in front of camera
    const cam = document.querySelector('#vr-camera');
    if (cam) {
      const cp = new THREE.Vector3();
      const cd = new THREE.Vector3();
      cam.object3D.getWorldPosition(cp);
      cam.object3D.getWorldDirection(cd);
      panel.setAttribute('position', {
        x: cp.x - cd.x * 2.2,
        y: cp.y - cd.y * 2.2 + 0.15,
        z: cp.z - cd.z * 2.2
      });
      panel.object3D.lookAt(cp);
    }

    const sevColor = organData.severity === 'HIGH' ? '#ff1744' : organData.severity === 'MODERATE' ? '#ffab00' : '#66bb6a';
    const sevLabel = organData.severity === 'HIGH' ? 'HIGH RISK' : organData.severity === 'MODERATE' ? 'MODERATE' : 'LOW RISK';

    // Set header
    panel.querySelector('#rpt-title').setAttribute('text', { value: 'VR DIAGNOSTIC REPORT', color: '#00e5ff', align: 'center', width: 2.6, font: 'mozillavr', wrapCount: 45 });
    panel.querySelector('#rpt-patient').setAttribute('text', {
      value: `Patient: ${PATIENT_DATA.patientName}  |  MRN: ${PATIENT_DATA.patientId}\nAge: ${PATIENT_DATA.age}  |  Sex: ${PATIENT_DATA.sex}  |  Scan: ${PATIENT_DATA.scanDate}`,
      color: '#78909c', align: 'center', width: 2.4, font: 'mozillavr', wrapCount: 65
    });

    panel.querySelector('#rpt-organ').setAttribute('text', { value: `ORGAN: ${organData.organName.toUpperCase()}`, color: '#e0f7fa', align: 'center', width: 2.4, font: 'mozillavr', wrapCount: 45 });
    panel.querySelector('#rpt-site').setAttribute('text', { value: `Site: ${organData.anatomicalPart}`, color: '#b0bec5', align: 'center', width: 2.3, font: 'mozillavr', wrapCount: 55 });
    panel.querySelector('#rpt-disease').setAttribute('text', { value: `DIAGNOSIS: ${organData.disease}`, color: sevColor, align: 'center', width: 2.4, font: 'mozillavr', wrapCount: 50 });
    panel.querySelector('#rpt-severity').setAttribute('text', { value: `SEVERITY: ${sevLabel}`, color: sevColor, align: 'center', width: 2.2, font: 'mozillavr', wrapCount: 40 });

    // Tab content
    const diagContent = panel.querySelector('#rpt-diag-content');
    const nerveContent = panel.querySelector('#rpt-nerve-content');
    const tabDiag = panel.querySelector('#tab-diagnostic');
    const tabNerve = panel.querySelector('#tab-nerves');

    if (tab === 'diagnostic') {
      diagContent.setAttribute('visible', true);
      nerveContent.setAttribute('visible', false);
      tabDiag.querySelector('a-plane').setAttribute('color', '#00838f');
      tabNerve.querySelector('a-plane').setAttribute('color', '#1a2a3a');

      panel.querySelector('#rpt-analysis-label').setAttribute('text', { value: 'ANALYSIS & RECOMMENDATIONS:', color: '#4dd0e1', align: 'left', width: 2.2, font: 'mozillavr', wrapCount: 50 });
      panel.querySelector('#rpt-analysis').setAttribute('text', { value: organData.report, color: '#cfd8dc', align: 'left', width: 2.2, font: 'mozillavr', wrapCount: 62 });
    } else {
      diagContent.setAttribute('visible', false);
      nerveContent.setAttribute('visible', true);
      tabDiag.querySelector('a-plane').setAttribute('color', '#1a2a3a');
      tabNerve.querySelector('a-plane').setAttribute('color', '#00838f');

      // Build nerve innervation text
      let nerveText = '';
      const nerves = organData.innervation || [];
      // Show up to 3 nerves per page (limited VR text space)
      const pageSize = 3;
      const currentPage = panel._nervePage || 0;
      const start = currentPage * pageSize;
      const pageNerves = nerves.slice(start, start + pageSize);

      pageNerves.forEach((n, i) => {
        nerveText += `[${start + i + 1}] ${n.nerveName}\n`;
        nerveText += `    Type: ${n.type}\n`;
        nerveText += `    Branch: ${n.branch.substring(0, 90)}...\n`;
        nerveText += `    Function: ${n.function.substring(0, 100)}...\n`;
        nerveText += `    Finding: ${n.pathology.substring(0, 100)}...\n\n`;
      });

      if (nerves.length > pageSize) {
        nerveText += `--- Page ${currentPage + 1}/${Math.ceil(nerves.length / pageSize)} | Click [>] for more ---`;
      }

      panel.querySelector('#rpt-nerve-list').setAttribute('text', { value: nerveText, color: '#cfd8dc', align: 'left', width: 2.3, font: 'mozillavr', wrapCount: 68, lineHeight: 55 });
    }

    // Store current organ data for tab switching and pagination
    panel._currentOrgan = organData;
    panel._nervePage = panel._nervePage || 0;
    panel.setAttribute('visible', true);
  }
});

// ─── tab-switch ─────────────────────────────
AFRAME.registerComponent('tab-switch', {
  schema: { tab: { type: 'string', default: 'diagnostic' } },
  init: function () {
    this.el.addEventListener('click', () => {
      const panel = document.querySelector('#report-panel');
      if (!panel || !panel._currentOrgan) return;
      if (this.data.tab === 'nerves') panel._nervePage = 0;
      // Re-render the report with the new tab
      const organData = panel._currentOrgan;
      const comp = { _showReport: AFRAME.components['organ-interaction'].Component.prototype._showReport };
      comp._showReport.call({ el: { sceneEl: document.querySelector('a-scene') } }, organData, this.data.tab);
    });
  }
});

// ─── nerve-page-nav ─────────────────────────────
AFRAME.registerComponent('nerve-page-nav', {
  schema: { direction: { type: 'number', default: 1 } },
  init: function () {
    this.el.addEventListener('click', () => {
      const panel = document.querySelector('#report-panel');
      if (!panel || !panel._currentOrgan) return;
      const nerves = panel._currentOrgan.innervation || [];
      const totalPages = Math.ceil(nerves.length / 3);
      panel._nervePage = (panel._nervePage || 0) + this.data.direction;
      if (panel._nervePage < 0) panel._nervePage = totalPages - 1;
      if (panel._nervePage >= totalPages) panel._nervePage = 0;
      const comp = AFRAME.components['organ-interaction'].Component.prototype;
      comp._showReport.call({ el: { sceneEl: document.querySelector('a-scene') } }, panel._currentOrgan, 'nerves');
    });
  }
});

// ─── close-panel ─────────────────────────────
AFRAME.registerComponent('close-panel', {
  init: function () {
    this.el.addEventListener('click', () => {
      const p = document.querySelector('#report-panel');
      if (p) { p.setAttribute('visible', false); p._currentOrgan = null; p._nervePage = 0; }
    });
  }
});

// ─── layer-toggle ─────────────────────────────
AFRAME.registerComponent('layer-toggle', {
  schema: { layer: { type: 'string', default: '' } },
  init: function () {
    this.el.addEventListener('click', () => {
      const layerId = 'layer-' + this.data.layer;
      const layerEl = document.querySelector('#' + layerId);
      if (!layerEl) return;
      const vis = layerEl.getAttribute('visible');
      layerEl.setAttribute('visible', !vis);
      // Toggle button appearance
      const btn = this.el.querySelector('a-plane');
      if (btn) {
        btn.setAttribute('opacity', !vis ? 0.9 : 0.35);
      }
    });
  }
});
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     A-FRAME SCENE
     ═══════════════════════════════════════════════════════════════════ -->
<a-scene

  <!-- ═══ ENVIRONMENT ═══ -->

  <!-- Backdrop pillars -->
  <a-cylinder position="-6 2 -9" radius="0.15" height="5" color="#0d1f33" material="shader: flat; opacity: 0.35"></a-cylinder>

  <!-- ═══ LIGHTING ═══ -->

  <a-entity light="type: directional; color: #a0d8ef; intensity: 0.6" position="2 5 2"></a-entity>
  <a-entity light="type: point; color: #00e5ff; intensity: 0.5; distance: 10; decay: 2" position="0 3.5 -3"></a-entity>
  <a-entity light="type: point; color: #0288d1; intensity: 0.35; distance: 7; decay: 2" position="-2.5 1 -2"></a-entity>
  <a-entity light="type: point; color: #0288d1; intensity: 0.35; distance: 7; decay: 2" position="2.5 1 -4"></a-entity>
  <a-entity light="type: spot; color: #e0f7fa; intensity: 1.2; angle: 40; penumbra: 0.6; distance: 12; decay: 1.5" position="0 5 -3" rotation="-90 0 0"></a-entity>

  <!-- ═══ CAMERA RIG ═══ -->
  <a-entity id="camera-rig" position="0 0 0">
    <a-camera id="vr-camera" position="0 1.6 0" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 20">
      <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable, .btn; far: 15">
        <a-ring position="0 0 -1" radius-inner="0.007" radius-outer="0.013" color="#00e5ff" material="shader: flat; opacity: 0.6"></a-ring>
      </a-entity>
    </a-camera>
    <a-entity oculus-touch-controls="hand: left"></a-entity>
    <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable, .btn; far: 10"></a-entity>
  </a-entity>

  <!-- ═══ TITLE HUD ═══ -->
  <a-entity position="0 3.7 -4.5">
    <a-text value="VR FULL-BODY ANATOMY & NERVE VISUALIZER" align="center" color="#00e5ff" width="5.5" font="mozillavr"></a-text>
    <a-text value="Hover organ to identify  |  Click for diagnostic report + nerve analysis" align="center" color="#546e7a" width="3.8" position="0 -0.22 0" font="mozillavr"></a-text>

  </a-entity>

  <!-- ═══════════════════════════════════════════════════════════════════

       ═══════════════════════════════════════════════════════════════════ -->

    <!-- ═══ LAYER: SKIN (transparent outer shell) ═══ -->
    <a-entity id="layer-skin" visible="false">

      <!-- Torso -->

      <a-cylinder position="0.18 -0.25 0" radius="0.13" height="1.0" material="color: #ffcc80; transparent: true; opacity: 0.08; shader: flat"></a-cylinder>

    <!-- ═══ LAYER: SKELETON ═══ -->

      <a-torus position="0 0.35 0" radius="0.28" radius-tubular="0.015" mixin="bone-mat" rotation="85 0 0" scale="1.2 1 0.5"></a-torus>
      <!-- Shoulder line -->

      <a-box position="0.15 1.35 -0.1" width="0.22" height="0.25" depth="0.08" mixin="muscle-mat" rotation="0 -10 0"></a-box>

        <a-sphere position="-0.08 1.4 0.13" radius="0.012" mixin="nerve-mat"></a-sphere>
        <a-sphere position="0.08 1.4 0.13" radius="0.012" mixin="nerve-mat"></a-sphere>

      <!-- Phrenic Nerve (C3-C5 to diaphragm) -->
      <a-entity id="nerve-phrenic" nerve-glow>

        <a-cylinder position="0.12 1.35 0.0" radius="0.007" height="0.35" mixin="nerve-mat" rotation="0 0 -2"></a-cylinder>
        <a-cylinder position="0.13 1.05 -0.02" radius="0.007" height="0.3" mixin="nerve-mat" rotation="0 0 3"></a-cylinder>
      </a-entity>

      <!-- Intercostal Nerves (along ribs) -->
      <a-entity id="nerve-intercostal" nerve-glow>
        <a-torus position="0 1.35 0" radius="0.38" radius-tubular="0.004" mixin="nerve-mat" scale="1 0.15 0.6" rotation="0 0 0"></a-torus>
        <a-torus position="0 1.25 0" radius="0.4" radius-tubular="0.004" mixin="nerve-mat" scale="1 0.15 0.6" rotation="0 0 0"></a-torus>

        <a-torus position="0 0.95 0" radius="0.38" radius-tubular="0.004" mixin="nerve-mat" scale="1 0.15 0.6" rotation="0 0 0"></a-torus>
      </a-entity>

      <!-- Greater Splanchnic Nerve (T5-T9 to celiac ganglion) -->
      <a-entity id="nerve-splanchnic" nerve-glow>
        <a-cylinder position="-0.06 1.1 0.12" radius="0.006" height="0.4" mixin="nerve-mat" rotation="8 0 5"></a-cylinder>
